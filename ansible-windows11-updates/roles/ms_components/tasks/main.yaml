- block:
    - name: Crear carpeta de logs si no existe
      ansible.windows.win_shell: |
        if (-Not (Test-Path "{{ log_path }}")) {
          New-Item -ItemType Directory -Path "{{ log_path }}"
        }

    - name: Actualizar componentes Microsoft definidos en vars.yaml
      ansible.windows.win_shell: |
        $components = @({{ ms_components | map('regex_replace', '^(.*)$', '"\1"') | join(', ') }})
        foreach ($comp in $components) {
          winget upgrade --id $comp --exact --silent --accept-source-agreements --accept-package-agreements
          switch ($LASTEXITCODE) {
            0 { Add-Content -Path "{{ report_file }}" -Value "Componente actualizado: $comp" }
            -1978335189 { Add-Content -Path "{{ report_file }}" -Value "Componente ya estaba actualizado: $comp" }
            -1978335212 { Add-Content -Path "{{ report_file }}" -Value "Componente no encontrado en winget: $comp (revisar ID)" }
            default { Add-Content -Path "{{ report_file }}" -Value "Error al actualizar componente: $comp (exit $LASTEXITCODE)" }
          }
        }
      async: 1800
      poll: 15

    - name: Actualizar aplicaciones de Microsoft Store
      ansible.windows.win_shell: |
        winget upgrade --all --source msstore --silent --accept-source-agreements --accept-package-agreements
        Add-Content -Path "{{ report_file }}" -Value "Actualización de Microsoft Store completada (exit $LASTEXITCODE)"
      async: 900
      poll: 15
  rescue:
    - name: Registrar error en reporte
      ansible.windows.win_shell: |
        Add-Content -Path "{{ report_file }}" -Value "Error en rol Microsoft Components"
  always:
    - name: Confirmar finalización de rol Microsoft Components
      ansible.windows.win_shell: |
        Add-Content -Path "{{ report_file }}" -Value "Finalizó rol Microsoft Components"
