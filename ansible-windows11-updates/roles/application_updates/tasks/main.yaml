---
# roles/application_updates/tasks/main.yaml
#
# Actualización de aplicaciones por ID EXACTO de WinGet. Este archivo solo traduce las
# variables de cara al usuario (application_updates_*) al espacio de nombres del motor
# (winget_engine_*, ver tasks/engine.yaml) y delega en él. Por defecto solo CONSULTA.
#
# Publica (contrato de `reporting`):
#   application_updates_results -> lista por app
#   application_updates_summary -> dict {mode, status (ok|partial|failed), total, problems, ...}

- name: application_updates | Evaluar aplicaciones con el motor WinGet
  ansible.builtin.include_tasks:
    file: engine.yaml
  vars:
    winget_engine_mode: "{{ application_updates_mode }}"
    winget_engine_apps: "{{ application_updates_apps }}"
    winget_engine_limit_ids: "{{ application_updates_limit_ids }}"
    winget_engine_default_source: "{{ application_updates_default_source }}"
    winget_engine_timeout_seconds: "{{ application_updates_timeout_seconds }}"
    winget_engine_close_processes: "{{ application_updates_close_processes }}"
    winget_engine_force_close: "{{ application_updates_force_close }}"
    winget_engine_grace_seconds: "{{ application_updates_grace_seconds }}"
    winget_engine_fail_on_error: "{{ application_updates_fail_on_error }}"
    winget_engine_problem_classes: "{{ application_updates_problem_classes }}"
    winget_engine_failure_classes: "{{ application_updates_engine_failure_classes }}"
    winget_engine_result_prefix: application_updates