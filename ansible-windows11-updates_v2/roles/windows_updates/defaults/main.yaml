---
# roles/windows_updates/defaults/main.yaml
#
# Seguridad por defecto: solo CONSULTA, sin reinicios, sin drivers, sin feature packs,
# sin upgrades de versión y respetando el catálogo configurado en el equipo (WSUS/MU/WU).

# 'check'   -> state: searched. No descarga ni instala nada.
# 'install' -> instala. Exige update_manager_confirm: INSTALL (y no admite --check).
windows_updates_mode: check

# Categorías conservadoras iniciales (nombres tal como los acepta win_updates).
windows_updates_base_categories:
  - SecurityUpdates
  - CriticalUpdates
  - DefinitionUpdates
  - UpdateRollups
  - Updates

# Categorías adicionales explícitas (p. ej. ['Updates'] si la consulta muestra que las
# acumulativas de tu equipo vienen en esa categoría). Revísalo primero en modo check:
# cada resultado informa sus 'categories'.
windows_updates_extra_categories: []

# Opt-in explícito. Todos desactivados por defecto.
windows_updates_include_drivers: false
windows_updates_include_feature_packs: false
windows_updates_include_upgrades: false   # upgrades de versión de Windows

# Filtros opcionales (KB o título como regex de PowerShell). Vacío = sin filtro.
windows_updates_accept_list: []
windows_updates_reject_list: []

# Omite actualizaciones opcionales (BrowseOnly). Si activas drivers, ponlo en false:
# los drivers suelen ser opcionales y quedarían filtrados.
windows_updates_skip_optional: true

# Catálogo de origen. Mantener 'default': respeta WSUS/política del equipo.
# Cambiarlo puede eludir una política corporativa; solo con evidencia de que hace falta.
windows_updates_server_selection: default

# Reinicio controlado. Solo válido en modo install.
windows_updates_reboot: false
windows_updates_reboot_timeout: 1200        # segundos de espera de reconexión

# Espera adicional tras un reinicio, antes de la verificación posterior.
windows_updates_post_reboot_delay: 30
windows_updates_post_reboot_timeout: 300

# Log persistente del módulo Windows Update. El rol crea el directorio automáticamente.
windows_updates_log_directory: 'C:\Logs\ansible_updates'
windows_updates_log_path: 'C:\Logs\ansible_updates\windows_update.log'
# Si el módulo falla en la tarea programada (Task Scheduler), ejecutar con become SYSTEM.
windows_updates_use_become: false

# Si es true, el rol falla al final cuando el estado es 'failed'. Si es false solo lo
# reporta y deja que el rol `reporting` decida el resultado del job.
windows_updates_fail_on_error: false
