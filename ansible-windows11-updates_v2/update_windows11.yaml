---
# update_windows11.yml
#
# INSTALA actualizaciones de Windows 11 y de aplicaciones. Está BLOQUEADO: sin
# update_manager_confirm: INSTALL no hace nada (falla antes de tocar el equipo).
# Ejecútalo solo después de revisar el informe de check_updates.yml.
#
# Confirmación (obligatoria):
#   update_manager_confirm: INSTALL        (exactamente así, en mayúsculas)
#
# Fases (cada una se puede desactivar; por defecto todas activas):
#   update_manager_run_windows_updates       update_manager_run_application_updates
#   update_manager_run_ms_components
#
# Alcance, categorías y reinicio: visibles y modificables desde la encuesta/extra vars
# de AWX. Todos tienen un valor por defecto CONSERVADOR:
#   windows_updates_reboot: false               Reinicio automático (desactivado)
#   windows_updates_include_drivers: false      Drivers (desactivado)
#   windows_updates_include_feature_packs: false
#   windows_updates_include_upgrades: false     Upgrades de versión de Windows
#   windows_updates_extra_categories: []        Categorías adicionales
#   application_updates_limit_ids: []           Limitar WinGet a estos IDs (recomendado la 1ª vez)
#   ms_components_limit_ids: []                 Limitar componentes Microsoft a estos IDs
#   application_updates_close_processes: false  Cierre ordenado de procesos de la app
#   application_updates_force_close: false      Cierre FORZADO (puede perder trabajo sin guardar)
#   update_manager_continue_on_failure: false   Si Windows Update falla, omitir las apps
#
# No ejecutar con --check: los roles lo rechazan (instalar en modo prueba no tiene sentido).
#
# Evidencia: informe `update_manager_report_<host>` en los artefactos del job (set_stats).
# Si el resultado global es 'parcial' o 'fallido', el job termina como failed DESPUÉS de publicarlo.
#
# Validar sintaxis (sin conectar a Windows):
#   ansible-playbook --syntax-check -i localhost, update_windows11.yml

- name: Instalar actualizaciones de Windows 11 (requiere confirmación explícita)
  hosts: "{{ update_manager_hosts | default('windows') }}"
  gather_facts: false

  vars:
    reporting_fail_job_on_partial: true
    reporting_required_phases: >-
      {{ (['windows_updates'] if (update_manager_run_windows_updates | default(true) | bool) else [])
         + (['application_updates'] if (update_manager_run_application_updates | default(true) | bool) else [])
         + (['ms_components'] if (update_manager_run_ms_components | default(true) | bool) else []) }}

  pre_tasks:
    - name: Exigir confirmación explícita antes de cualquier cambio
      ansible.builtin.assert:
        that:
          - (update_manager_confirm | default('')) == 'INSTALL'
          - not (ansible_check_mode | default(false))
        fail_msg: >-
          Instalación bloqueada: define update_manager_confirm: INSTALL (en mayúsculas)
          y no uses --check. Para solo consultar usa check_updates.yml.
        quiet: true

    - name: Mostrar alcance de la ejecución
      ansible.builtin.debug:
        msg:
          - "Windows Update: {{ update_manager_run_windows_updates | default(true) | bool }}"
          - "Aplicaciones WinGet: {{ update_manager_run_application_updates | default(true) | bool }}"
          - "Componentes Microsoft: {{ update_manager_run_ms_components | default(true) | bool }}"
          - "Reinicio automático: {{ windows_updates_reboot | default(false) | bool }}"
          - "Seguir con apps si Windows Update falla: {{ update_manager_continue_on_failure | default(false) | bool }}"

  tasks:
    - name: Instalación por fases
      block:
        - name: Windows Update (instalación)
          ansible.builtin.include_role:
            name: windows_updates
          vars:
            windows_updates_mode: install
          when: update_manager_run_windows_updates | default(true) | bool

        # Si Windows Update falla o deja trabajo pendiente, se omiten las aplicaciones
        # salvo que se pida explícitamente continuar. La fase requerida omitida se reporta.
        - name: Informar si se omiten las aplicaciones por fallo de Windows Update
          ansible.builtin.debug:
            msg: "Se omiten las fases de aplicaciones: Windows Update terminó en estado failed/partial."
          when:
            - (windows_updates_summary.status | default('ok')) in ['failed', 'partial']
            - not (update_manager_continue_on_failure | default(false) | bool)

        - name: Aplicaciones WinGet (actualización)
          ansible.builtin.include_role:
            name: application_updates
          vars:
            application_updates_mode: upgrade
          when:
            - update_manager_run_application_updates | default(true) | bool
            - (update_manager_continue_on_failure | default(false) | bool) or ((windows_updates_summary.status | default('ok')) not in ['failed', 'partial'])

        - name: Componentes Microsoft (actualización)
          ansible.builtin.include_role:
            name: ms_components
          vars:
            ms_components_mode: upgrade
          when:
            - update_manager_run_ms_components | default(true) | bool
            - (update_manager_continue_on_failure | default(false) | bool) or ((windows_updates_summary.status | default('ok')) not in ['failed', 'partial'])

      rescue:
        - name: Registrar la tarea que falló (para el informe)
          ansible.builtin.set_fact:
            update_manager_failure: "{{ ansible_failed_task.name | default('desconocida') }}"
            update_manager_failure_detail: "{{ ansible_failed_result.msg | default('') }}"

      always:
        - name: Publicar informe
          ansible.builtin.include_role:
            name: reporting
