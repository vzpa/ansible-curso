---
# check_updates.yaml
#
# CONSULTA de actualizaciones de Windows 11. No descarga, no instala y no reinicia.
# Es el flujo obligatorio previo a la instalación: ejecútalo y revisa el informe antes
# de usar update_windows11.yaml.
#
# Fases (cada una se puede desactivar con su variable; por defecto todas activas):
#   update_manager_run_preflight             Comprobaciones previas (solo lectura)
#   update_manager_run_windows_updates       Windows Update (win_updates, state: searched)
#   update_manager_run_application_updates   Aplicaciones por ID exacto de WinGet
#   update_manager_run_ms_components         Componentes Microsoft por ID exacto de WinGet
#
# Puerta de preflight: si preflight termina en 'failed' (p. ej. la identidad no es
# administrador), las demás fases se OMITEN y el informe lo refleja. Para consultar
# igualmente: update_manager_continue_on_failure: true.
#
# Variables opcionales para encuesta/extra vars de AWX (todas tienen valor por defecto):
#   update_manager_hosts               Grupo/host destino (defecto: windows)
#   application_updates_limit_ids      Limitar WinGet a estos IDs
#   ms_components_limit_ids            Limitar componentes Microsoft a estos IDs
#   windows_updates_extra_categories   Categorías adicionales de Windows Update
#
# Evidencia: informe `update_manager_report_<host>` en los artefactos del job (set_stats)
# con el resultado global (correcto | parcial | fallido), el estado por fase y el
# rc/clasificación por elemento. Si el resultado global es 'fallido', el job termina
# como failed DESPUÉS de publicar el informe.
#
# Ubicación: este archivo está junto a la carpeta roles/ a propósito. Sin ansible.cfg,
# Ansible solo busca roles en <carpeta del playbook>/roles.
#
# Validar sintaxis (sin conectar a Windows):
#   ansible-playbook --syntax-check -i localhost, check_updates.yaml

- name: Consultar actualizaciones de Windows 11 (sin instalar ni reiniciar)
  hosts: "{{ update_manager_hosts | default('windows') }}"
  gather_facts: false

  vars:
    # El informe exige haber ejecutado las fases activas: si un rol aborta antes de
    # publicar su resumen, el resultado global es 'fallido' y no 'correcto'.
    reporting_required_phases: >-
      {{ (['preflight'] if (update_manager_run_preflight | default(true) | bool) else [])
         + (['windows_updates'] if (update_manager_run_windows_updates | default(true) | bool) else [])
         + (['application_updates'] if (update_manager_run_application_updates | default(true) | bool) else [])
         + (['ms_components'] if (update_manager_run_ms_components | default(true) | bool) else []) }}
    # Puerta: true si preflight falló y no se pidió continuar.
    update_manager_preflight_blocked: >-
      {{ ((preflight_summary.status | default('ok')) == 'failed')
         and not (update_manager_continue_on_failure | default(false) | bool) }}

  pre_tasks:
    - name: Garantizar que este playbook es solo de consulta
      ansible.builtin.assert:
        that:
          - (windows_updates_mode | default('check')) == 'check'
          - (application_updates_mode | default('check')) == 'check'
          - (ms_components_mode | default('check')) == 'check'
          - not (windows_updates_reboot | default(false) | bool)
        fail_msg: >-
          check_updates.yaml es solo de consulta: no admite modos de instalación ni reinicio.
          Para instalar usa update_windows11.yaml con update_manager_confirm: INSTALL.
        quiet: true

  tasks:
    - name: Consulta por fases
      block:
        - name: Preflight (solo lectura)
          ansible.builtin.include_role:
            name: preflight
          when: update_manager_run_preflight | default(true) | bool

        - name: Informar si se omiten las fases por fallo de preflight
          ansible.builtin.debug:
            msg: "Se omiten las fases de consulta: preflight terminó en 'failed'. Revisa sus comprobaciones."
          when: update_manager_preflight_blocked | bool

        - name: Windows Update (solo búsqueda)
          ansible.builtin.include_role:
            name: windows_updates
          vars:
            windows_updates_mode: check
          when:
            - update_manager_run_windows_updates | default(true) | bool
            - not (update_manager_preflight_blocked | bool)

        - name: Aplicaciones WinGet (solo consulta)
          ansible.builtin.include_role:
            name: application_updates
          vars:
            application_updates_mode: check
          when:
            - update_manager_run_application_updates | default(true) | bool
            - not (update_manager_preflight_blocked | bool)

        - name: Componentes Microsoft (solo consulta)
          ansible.builtin.include_role:
            name: ms_components
          vars:
            ms_components_mode: check
          when:
            - update_manager_run_ms_components | default(true) | bool
            - not (update_manager_preflight_blocked | bool)

      rescue:
        - name: Registrar la tarea que falló (para el informe)
          ansible.builtin.set_fact:
            update_manager_failure: "{{ ansible_failed_task.name | default('desconocida') }}"

      always:
        - name: Publicar informe
          ansible.builtin.include_role:
            name: reporting